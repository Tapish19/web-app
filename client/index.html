<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ProjectFlow</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#0f172a;
      color:white;
      min-height:100vh;
    }

    .app-shell{
      display:grid;
      grid-template-columns:260px 1fr;
      min-height:100vh;
    }

    .sidebar{
      background:#111827;
      padding:20px;
    }

    .sidebar h1{
      margin-bottom:20px;
    }

    .sidebar nav{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .sidebar nav a{
      color:white;
      text-decoration:none;
      padding:12px;
      border-radius:8px;
    }

    .sidebar nav a.active{
      background:#2563eb;
    }

    .content{
      padding:20px;
    }

    .card{
      background:#1e293b;
      padding:20px;
      border-radius:12px;
      margin-bottom:20px;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .user-pill{
      background:#334155;
      padding:10px 16px;
      border-radius:999px;
    }

    .stats-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:20px;
      margin:20px 0;
    }

    .stat p{
      font-size:32px;
      margin-top:10px;
    }

    table{
      width:100%;
      border-collapse:collapse;
    }

    th,td{
      border-bottom:1px solid #334155;
      padding:12px;
      text-align:left;
    }

    button{
      border:none;
      cursor:pointer;
    }

    .cta{
      background:#2563eb;
      color:white;
      padding:10px 14px;
      border-radius:8px;
    }

    .danger{
      background:#dc2626;
    }

    .tag{
      padding:5px 10px;
      border-radius:999px;
      font-size:12px;
    }

    .todo{
      background:#7c2d12;
    }

    .progress{
      background:#1d4ed8;
    }

    .done{
      background:#166534;
    }

    input,select{
      background:#334155;
      color:white;
      border:none;
      padding:8px;
      border-radius:8px;
    }

    #auth-screen{
      max-width:500px;
      margin:60px auto;
    }

    .hidden{
      display:none;
    }

  </style>
</head>

<body>

<!-- LOGIN / SIGNUP -->

<div id="auth-screen">

  <div class="card">

    <h2 id="auth-title">Login</h2>

    <br>

    <p id="auth-message"></p>

    <br>

    <form id="auth-form">

      <input
        id="auth-name"
        placeholder="Full Name (Signup only)"
        style="width:100%;margin-bottom:10px;"
      />

      <input
        id="auth-email"
        type="email"
        placeholder="Email"
        required
        style="width:100%;margin-bottom:10px;"
      />

      <input
        id="auth-password"
        type="password"
        placeholder="Password"
        required
        style="width:100%;margin-bottom:10px;"
      />

      <button class="cta" id="auth-submit">
        Login
      </button>

      <button
        type="button"
        class="cta"
        id="auth-switch"
        style="background:#475569;margin-left:10px;"
      >
        Need Signup?
      </button>

    </form>

  </div>

</div>

<!-- APP -->

<div class="app-shell hidden" id="app-shell">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <h1>ProjectFlow</h1>

    <nav id="sidebar-nav">

      <a href="#" class="active" data-view="dashboard">
        Dashboard
      </a>

      <a href="#" data-view="projects">
        Projects
      </a>

      <a href="#" data-view="tasks">
        Tasks
      </a>

    </nav>

    <br>

    <button class="cta" id="new-project-btn">
      + New Project
    </button>

    <br><br>

    <button class="cta" id="new-task-btn">
      + New Task
    </button>

  </aside>

  <!-- CONTENT -->

  <main class="content">

    <div class="card topbar">

      <div>
        <h2 id="view-title">
          Dashboard
        </h2>

        <p id="view-subtitle">
          Manage projects and tasks
        </p>
      </div>

      <div>

        <span class="user-pill" id="user-pill">
          Guest
        </span>

        <button
          class="cta danger"
          id="logout-btn"
          style="margin-left:10px;"
        >
          Logout
        </button>

      </div>

    </div>

    <!-- STATS -->

    <section class="stats-grid">

      <article class="card stat">
        <h3>Total Tasks</h3>
        <p id="stat-total">0</p>
      </article>

      <article class="card stat">
        <h3>In Progress</h3>
        <p id="stat-progress">0</p>
      </article>

      <article class="card stat">
        <h3>Done</h3>
        <p id="stat-done">0</p>
      </article>

      <article class="card stat">
        <h3>Projects</h3>
        <p id="stat-projects">0</p>
      </article>

    </section>

    <!-- TABLE -->

    <section class="card">

      <h3 id="table-title">
        Recent Tasks
      </h3>

      <br>

      <table>

        <thead>
          <tr>
            <th>Name</th>
            <th>Assigned</th>
            <th>Status</th>
            <th>Due</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="table-body"></tbody>

      </table>

    </section>

  </main>

</div>

<script>

const USERS_KEY = "pf_users";
const SESSION_KEY = "pf_session";

let authMode = "login";
let currentUser = null;

const teamMembers = [
  "Rina",
  "Lee",
  "Maya",
  "Arun",
  "Nina"
];

const projects = [
  {
    id:1,
    name:"Website Revamp",
    admin:"Rina",
    members:["Lee","Maya"],
    status:"In Progress",
    due:"2026-05-20"
  }
];

const tasks = [
  {
    id:1,
    title:"Setup Login",
    projectId:1,
    createdBy:"Rina",
    assignee:"Lee",
    status:"To Do",
    due:"2026-05-08"
  }
];

const views = {

  dashboard:{
    title:"Dashboard",
    subtitle:"Overview of tasks"
  },

  projects:{
    title:"Projects",
    subtitle:"Manage all projects"
  },

  tasks:{
    title:"Tasks",
    subtitle:"Manage all tasks"
  }

};

const nav = document.getElementById("sidebar-nav");
const tableBody = document.getElementById("table-body");

function users(){
  return JSON.parse(
    localStorage.getItem(USERS_KEY) || "[]"
  );
}

function saveUsers(data){
  localStorage.setItem(
    USERS_KEY,
    JSON.stringify(data)
  );
}

function setMessage(text,color="#9ec5ff"){

  const el = document.getElementById("auth-message");

  el.textContent = text;
  el.style.color = color;
}

function setAuthMode(mode){

  authMode = mode;

  document.getElementById("auth-title").textContent =
    mode === "login"
      ? "Login"
      : "Signup";

  document.getElementById("auth-submit").textContent =
    mode === "login"
      ? "Login"
      : "Create Account";

  document.getElementById("auth-switch").textContent =
    mode === "login"
      ? "Need Signup?"
      : "Back to Login";
}

function syncUi(){

  const loggedIn = Boolean(currentUser);

  document.getElementById("auth-screen")
    .classList.toggle("hidden",loggedIn);

  document.getElementById("app-shell")
    .classList.toggle("hidden",!loggedIn);

  document.getElementById("user-pill").textContent =
    loggedIn
      ? currentUser.name
      : "Guest";
}

function statusTag(status){

  return `
    <span class="tag ${
      status === "Done"
        ? "done"
        : status === "In Progress"
        ? "progress"
        : "todo"
    }">
      ${status}
    </span>
  `;
}

function isProjectAdmin(project){

  return (
    currentUser &&
    currentUser.name === project.admin
  );
}

function updateStats(){

  document.getElementById("stat-total")
    .textContent = tasks.length;

  document.getElementById("stat-progress")
    .textContent =
      tasks.filter(
        t=>t.status==="In Progress"
      ).length;

  document.getElementById("stat-done")
    .textContent =
      tasks.filter(
        t=>t.status==="Done"
      ).length;

  document.getElementById("stat-projects")
    .textContent = projects.length;
}

function renderProjects(){

  tableBody.innerHTML = "";

  projects.forEach(project=>{

    const admin =
      isProjectAdmin(project);

    const row =
      document.createElement("tr");

    row.innerHTML = `

      <td>
        ${project.name}
        <br>
        <small>
          Admin: ${project.admin}
        </small>
      </td>

      <td>
        ${project.members.join(", ")}
      </td>

      <td>

        ${
          admin
            ? `
              <select
                onchange="changeProjectStatus(${project.id},this.value)"
              >
                <option ${
                  project.status==="To Do"
                  ? "selected"
                  : ""
                }>
                  To Do
                </option>

                <option ${
                  project.status==="In Progress"
                  ? "selected"
                  : ""
                }>
                  In Progress
                </option>

                <option ${
                  project.status==="Done"
                  ? "selected"
                  : ""
                }>
                  Done
                </option>
              </select>
            `
            : statusTag(project.status)
        }

      </td>

      <td>

        ${
          admin
            ? `
              <input
                type="date"
                value="${project.due}"
                onchange="changeProjectDue(${project.id},this.value)"
              />
            `
            : project.due
        }

      </td>

      <td>

        ${
          admin
            ? `
              <button
                class="cta"
                onclick="assignMember(${project.id})"
              >
                Assign
              </button>
            `
            : "Only Admin"
        }

      </td>
    `;

    tableBody.appendChild(row);

  });
}

function renderTasks(){

  tableBody.innerHTML = "";

  tasks.forEach(task=>{

    const project =
      projects.find(
        p=>p.id===task.projectId
      );

    const admin =
      project &&
      isProjectAdmin(project);

    const row =
      document.createElement("tr");

    row.innerHTML = `

      <td>
        ${task.title}
        <br>
        <small>
          ${project.name}
        </small>
      </td>

      <td>

        ${
          admin
            ? `
              <select
                onchange="changeAssignee(${task.id},this.value)"
              >
                ${teamMembers.map(member=>`

                  <option
                    value="${member}"
                    ${
                      task.assignee===member
                        ? "selected"
                        : ""
                    }
                  >
                    ${member}
                  </option>

                `).join("")}
              </select>
            `
            : task.assignee
        }

      </td>

      <td>

        ${
          admin
            ? `
              <select
                onchange="changeTaskStatus(${task.id},this.value)"
              >
                <option ${
                  task.status==="To Do"
                  ? "selected"
                  : ""
                }>
                  To Do
                </option>

                <option ${
                  task.status==="In Progress"
                  ? "selected"
                  : ""
                }>
                  In Progress
                </option>

                <option ${
                  task.status==="Done"
                  ? "selected"
                  : ""
                }>
                  Done
                </option>
              </select>
            `
            : statusTag(task.status)
        }

      </td>

      <td>

        ${
          admin
            ? `
              <input
                type="date"
                value="${task.due}"
                onchange="changeTaskDue(${task.id},this.value)"
              />
            `
            : task.due
        }

      </td>

      <td>

        ${
          admin
            ? "Admin Access"
            : "No Access"
        }

      </td>
    `;

    tableBody.appendChild(row);

  });
}

function renderTable(view){

  if(view==="projects"){

    renderProjects();
    return;
  }

  renderTasks();
}

function changeProjectStatus(id,value){

  const project =
    projects.find(p=>p.id===id);

  if(!isProjectAdmin(project)) return;

  project.status = value;

  renderProjects();
}

function changeProjectDue(id,value){

  const project =
    projects.find(p=>p.id===id);

  if(!isProjectAdmin(project)) return;

  project.due = value;

  renderProjects();
}

function assignMember(projectId){

  const project =
    projects.find(p=>p.id===projectId);

  if(!isProjectAdmin(project)) return;

  const member =
    prompt(
      "Assign member:\n\n" +
      teamMembers.join(", ")
    );

  if(!member) return;

  if(!teamMembers.includes(member)){

    alert("Invalid member");
    return;
  }

  if(!project.members.includes(member)){

    project.members.push(member);
  }

  renderProjects();
}

function changeTaskStatus(id,value){

  const task =
    tasks.find(t=>t.id===id);

  const project =
    projects.find(
      p=>p.id===task.projectId
    );

  if(!isProjectAdmin(project)) return;

  task.status = value;

  renderTasks();
}

function changeTaskDue(id,value){

  const task =
    tasks.find(t=>t.id===id);

  const project =
    projects.find(
      p=>p.id===task.projectId
    );

  if(!isProjectAdmin(project)) return;

  task.due = value;

  renderTasks();
}

function changeAssignee(id,value){

  const task =
    tasks.find(t=>t.id===id);

  const project =
    projects.find(
      p=>p.id===task.projectId
    );

  if(!isProjectAdmin(project)) return;

  task.assignee = value;

  renderTasks();
}

nav.addEventListener("click",(e)=>{

  const link =
    e.target.closest("a[data-view]");

  if(!link || !currentUser) return;

  e.preventDefault();

  nav.querySelectorAll("a")
    .forEach(a=>a.classList.remove("active"));

  link.classList.add("active");

  const view =
    link.dataset.view;

  document.getElementById("view-title")
    .textContent = views[view].title;

  document.getElementById("view-subtitle")
    .textContent = views[view].subtitle;

  renderTable(view);
});

document.getElementById("auth-switch")
.addEventListener("click",()=>{

  setAuthMode(
    authMode==="login"
      ? "signup"
      : "login"
  );
});

document.getElementById("auth-form")
.addEventListener("submit",(e)=>{

  e.preventDefault();

  const name =
    document.getElementById("auth-name")
    .value.trim();

  const email =
    document.getElementById("auth-email")
    .value.trim()
    .toLowerCase();

  const password =
    document.getElementById("auth-password")
    .value;

  const allUsers =
    users();

  if(authMode==="signup"){

    if(!name){

      setMessage(
        "Name required",
        "#ffb4b4"
      );

      return;
    }

    if(
      allUsers.some(
        u=>u.email===email
      )
    ){

      setMessage(
        "Email already exists",
        "#ffb4b4"
      );

      return;
    }

    allUsers.push({
      name,
      email,
      password
    });

    saveUsers(allUsers);

    setMessage(
      "Signup successful",
      "#9ff0b4"
    );

    setAuthMode("login");

    return;
  }

  const user =
    allUsers.find(
      u =>
        u.email===email &&
        u.password===password
    );

  if(!user){

    setMessage(
      "Invalid credentials",
      "#ffb4b4"
    );

    return;
  }

  currentUser = {
    name:user.name,
    email:user.email
  };

  localStorage.setItem(
    SESSION_KEY,
    JSON.stringify(currentUser)
  );

  syncUi();

  renderTable("dashboard");

  updateStats();
});

document.getElementById("logout-btn")
.addEventListener("click",()=>{

  currentUser = null;

  localStorage.removeItem(
    SESSION_KEY
  );

  syncUi();
});

document.getElementById("new-project-btn")
.addEventListener("click",()=>{

  if(!currentUser) return;

  const name =
    prompt("Project Name");

  if(!name) return;

  projects.push({

    id:projects.length + 1,

    name:name,

    admin:currentUser.name,

    members:[],

    status:"To Do",

    due:"2026-05-30"
  });

  renderProjects();

  updateStats();
});

document.getElementById("new-task-btn")
.addEventListener("click",()=>{

  if(!currentUser) return;

  const title =
    prompt("Task Name");

  if(!title) return;

  const projectId =
    Number(
      prompt(
        "Project ID?"
      )
    );

  const project =
    projects.find(
      p=>p.id===projectId
    );

  if(!project){

    alert("Project not found");
    return;
  }

  if(!isProjectAdmin(project)){

    alert(
      "Only project admin can create tasks"
    );

    return;
  }

  const assignee =
    prompt(
      "Assign To:\n\n" +
      teamMembers.join(", ")
    );

  if(
    !teamMembers.includes(
      assignee
    )
  ){

    alert("Invalid member");
    return;
  }

  tasks.push({

    id:tasks.length + 1,

    title,

    projectId,

    createdBy:currentUser.name,

    assignee,

    status:"To Do",

    due:"2026-05-15"
  });

  renderTasks();

  updateStats();
});

currentUser =
  JSON.parse(
    localStorage.getItem(
      SESSION_KEY
    ) || "null"
  );

setAuthMode("login");

syncUi();

if(currentUser){

  renderTable("dashboard");

  updateStats();
}

</script>

</body>
</html>
