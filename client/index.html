<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProjectFlow - Project Manager</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <h1>ProjectFlow</h1>
      <nav id="sidebar-nav">
        <a class="active" href="#" data-view="dashboard">Dashboard</a>
        <a href="#" data-view="projects">Projects</a>
        <a href="#" data-view="tasks">Tasks</a>
        <a href="#" data-view="team">Team</a>
      </nav>
      <button class="cta" id="new-project-btn">+ New Project</button>
    </aside>

    <main class="content">
      <header class="topbar card">
        <div>
          <h2 id="view-title">Welcome back 👋</h2>
          <p id="view-subtitle">Track progress, assignments, and overdue work in one place.</p>
        </div>
        <div class="user-pill" id="user-pill"></div>
      </header>

      <section class="stats-grid" id="stats-grid">
        <article class="card stat"><h3>Total Tasks</h3><p>38</p></article>
        <article class="card stat"><h3>In Progress</h3><p>14</p></article>
        <article class="card stat"><h3>Done</h3><p>19</p></article>
        <article class="card stat danger"><h3>Overdue</h3><p>5</p></article>
      </section>

      <section class="card" id="auth-card">
        <div class="section-head"><h3 id="auth-title">Login</h3></div>
        <form id="auth-form">
          <p><input id="auth-name" placeholder="Full name (required for signup)" style="width:100%;padding:8px;margin-bottom:8px" /></p>
          <p><input id="auth-email" type="email" placeholder="Email" required style="width:100%;padding:8px;margin-bottom:8px" /></p>
          <p><input id="auth-password" type="password" placeholder="Password" required style="width:100%;padding:8px;margin-bottom:8px" /></p>
          <p id="role-wrap" style="display:none;margin-bottom:8px">
            <select id="auth-role" style="width:100%;padding:8px"><option value="member">Member</option><option value="admin">Admin</option></select>
          </p>
          <button class="cta" type="submit" id="auth-submit">Login</button>
          <button type="button" id="auth-switch" style="margin-left:8px">Need Signup?</button>
        </form>
      </section>

      <section class="card" id="data-card" style="display:none">
        <div class="section-head">
          <h3 id="table-title">Recent Tasks</h3>
          <button id="view-all-btn">View All</button>
          <button id="logout-btn">Logout</button>
        </div>
        <table>
          <thead>
            <tr><th>Task</th><th>Assignee</th><th>Status</th><th>Due</th></tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </section>
    </main>
  </div>

<script>
const USERS_KEY = 'pf_users';
const SESSION_KEY = 'pf_session';
const teamMembers = ['Rina','Lee','Maya','Arun','Nina'];
const projects = [
  { name: 'Website Revamp', owner: 'Rina', status: 'In Progress', due: 'May 22' },
  { name: 'Mobile App', owner: 'Lee', status: 'To Do', due: 'Jun 3' }
];
const tableData = {
  dashboard: [
    ['Set up auth flow', 'Rina', '<span class="tag todo">To Do</span>', 'May 8'],
    ['Project API endpoints', 'Lee', '<span class="tag progress">In Progress</span>', 'May 6'],
    ['Dashboard charts', 'Maya', '<span class="tag done">Done</span>', 'May 4']
  ],
  tasks: [
    ['Design landing page', 'Arun', '<span class="tag progress">In Progress</span>', 'May 9'],
    ['Fix login redirect', 'Nina', '<span class="tag todo">To Do</span>', 'May 7'],
    ['Write tests', 'Lee', '<span class="tag done">Done</span>', 'May 3']
  ],
  team: teamMembers.map((m) => [m, '2 active tasks', '<span class="tag progress">Available</span>', '-'])
};
const views = {
  dashboard: { title:'Welcome back 👋', subtitle:'Track progress, assignments, and overdue work in one place.', tableTitle:'Recent Tasks' },
  projects: { title:'Projects', subtitle:'Manage timelines, owners, and delivery status.', tableTitle:'Active Projects' },
  tasks: { title:'Tasks', subtitle:'Review and update task progress by assignee.', tableTitle:'All Tasks' },
  team: { title:'Team', subtitle:'See contributors and current workload.', tableTitle:'Team Activity' }
};

let authMode = 'login';
let currentUser = null;

const nav = document.getElementById('sidebar-nav');
const title = document.getElementById('view-title');
const subtitle = document.getElementById('view-subtitle');
const tableTitle = document.getElementById('table-title');
const tableBody = document.getElementById('table-body');

const users = () => JSON.parse(localStorage.getItem(USERS_KEY) || '[]');
const saveUsers = (value) => localStorage.setItem(USERS_KEY, JSON.stringify(value));
const canManageProjects = () => currentUser?.role === 'admin';

const syncAuthUi = () => {
  document.getElementById('auth-card').style.display = currentUser ? 'none' : 'block';
  document.getElementById('data-card').style.display = currentUser ? 'block' : 'none';
  document.getElementById('new-project-btn').style.display = currentUser ? 'block' : 'none';
  document.getElementById('user-pill').textContent = currentUser ? `${currentUser.name} (${currentUser.role})` : 'Guest';
  document.getElementById('new-project-btn').disabled = !canManageProjects();
  document.getElementById('new-project-btn').title = canManageProjects() ? '' : 'Only Admin can create projects';
};

const setAuthMode = (mode) => {
  authMode = mode;
  document.getElementById('auth-title').textContent = mode === 'login' ? 'Login' : 'Signup';
  document.getElementById('auth-submit').textContent = mode === 'login' ? 'Login' : 'Signup';
  document.getElementById('auth-switch').textContent = mode === 'login' ? 'Need Signup?' : 'Have Login?';
  document.getElementById('role-wrap').style.display = mode === 'signup' ? 'block' : 'none';
};

const renderTable = (viewKey) => {
  tableBody.innerHTML = '';
  if (viewKey === 'projects') {
    projects.forEach((project, index) => {
      const row = document.createElement('tr');
      row.innerHTML = `<td>${project.name}</td><td>${project.owner}</td><td><span class="tag ${project.status === 'Done' ? 'done' : project.status === 'In Progress' ? 'progress' : 'todo'}">${project.status}</span></td><td>${project.due}<button data-project-index="${index}" class="assign-btn" style="margin-left:8px" ${canManageProjects() ? '' : 'disabled'}>Assign</button></td>`;
      tableBody.appendChild(row);
    });
    document.querySelectorAll('.assign-btn').forEach((button) => button.addEventListener('click', () => {
      if (!canManageProjects()) return alert('Only Admin can assign projects.');
      const index = Number(button.dataset.projectIndex);
      const selected = prompt(`Assign project owner (${teamMembers.join(', ')}):`, projects[index].owner);
      if (!selected || !teamMembers.includes(selected)) return alert(`Please use one of: ${teamMembers.join(', ')}`);
      projects[index].owner = selected;
      renderTable('projects');
    }));
    return;
  }
  (tableData[viewKey] || tableData.dashboard).forEach((cells) => {
    const row = document.createElement('tr');
    row.innerHTML = `<td>${cells[0]}</td><td>${cells[1]}</td><td>${cells[2]}</td><td>${cells[3]}</td>`;
    tableBody.appendChild(row);
  });
};

nav.addEventListener('click', (event) => {
  const link = event.target.closest('a[data-view]'); if (!link || !currentUser) return;
  event.preventDefault();
  nav.querySelectorAll('a').forEach((a) => a.classList.remove('active'));
  link.classList.add('active');
  const view = views[link.dataset.view];
  title.textContent = view.title; subtitle.textContent = view.subtitle; tableTitle.textContent = view.tableTitle;
  renderTable(link.dataset.view);
});

document.getElementById('new-project-btn').addEventListener('click', () => {
  if (!canManageProjects()) return alert('Only Admin can create projects.');
  const name = prompt('Project name:'); if (!name) return;
  const owner = prompt(`Owner (${teamMembers.join(', ')}):`, teamMembers[0]);
  if (!owner || !teamMembers.includes(owner)) return alert(`Please set owner to one of: ${teamMembers.join(', ')}`);
  projects.push({ name, owner, status: 'To Do', due: 'TBD' });
  if (nav.querySelector('a.active')?.dataset.view === 'projects') renderTable('projects');
  alert(`Project "${name}" created and assigned to ${owner}.`);
});

document.getElementById('auth-switch').addEventListener('click', () => setAuthMode(authMode === 'login' ? 'signup' : 'login'));
document.getElementById('auth-form').addEventListener('submit', (event) => {
  event.preventDefault();
  const name = document.getElementById('auth-name').value.trim();
  const email = document.getElementById('auth-email').value.trim().toLowerCase();
  const password = document.getElementById('auth-password').value;
  const role = document.getElementById('auth-role').value;
  const allUsers = users();

  if (authMode === 'signup') {
    if (!name) return alert('Name is required for signup.');
    if (allUsers.some((u) => u.email === email)) return alert('Email already registered.');
    allUsers.push({ name, email, password, role });
    saveUsers(allUsers);
    alert('Signup successful. Please login.');
    setAuthMode('login');
    return;
  }

  const user = allUsers.find((u) => u.email === email && u.password === password);
  if (!user) return alert('Invalid email or password.');
  currentUser = { name: user.name, email: user.email, role: user.role };
  localStorage.setItem(SESSION_KEY, JSON.stringify(currentUser));
  syncAuthUi();
  renderTable('dashboard');
});

document.getElementById('logout-btn').addEventListener('click', () => {
  currentUser = null;
  localStorage.removeItem(SESSION_KEY);
  syncAuthUi();
});

document.getElementById('view-all-btn').addEventListener('click', () => alert('Tip: Open the Projects tab to create and assign projects.'));

currentUser = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
setAuthMode('login');
syncAuthUi();
if (currentUser) renderTable('dashboard');
</script>
</body>
</html>
