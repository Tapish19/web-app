<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProjectFlow - Project Manager</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#0f172a;
      color:white;
      min-height:100vh;
    }

    .content{
      padding:20px;
    }

    .card{
      background:#1e293b;
      padding:20px;
      border-radius:12px;
      margin-bottom:20px;
    }

    .section-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
    }

    .cta{
      background:#2563eb;
      color:white;
      border:none;
      padding:10px 14px;
      border-radius:8px;
      cursor:pointer;
    }

    .cta:hover{
      background:#1d4ed8;
    }

    .app-shell{
      display:grid;
      grid-template-columns:250px 1fr;
      min-height:100vh;
    }

    .sidebar{
      background:#111827;
      padding:20px;
    }

    .sidebar h1{
      margin-bottom:20px;
    }

    .sidebar nav{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-bottom:20px;
    }

    .sidebar nav a{
      color:white;
      text-decoration:none;
      padding:10px;
      border-radius:8px;
    }

    .sidebar nav a.active{
      background:#2563eb;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .user-pill{
      background:#334155;
      padding:10px 16px;
      border-radius:999px;
    }

    .stats-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:20px;
      margin:20px 0;
    }

    .stat p{
      font-size:32px;
      margin-top:10px;
    }

    table{
      width:100%;
      border-collapse:collapse;
    }

    th,td{
      padding:12px;
      text-align:left;
      border-bottom:1px solid #334155;
    }

    .tag{
      padding:5px 10px;
      border-radius:999px;
      font-size:12px;
    }

    .todo{
      background:#7c2d12;
    }

    .progress{
      background:#1d4ed8;
    }

    .done{
      background:#166534;
    }

    input,select{
      width:100%;
      padding:10px;
      border:none;
      border-radius:8px;
      background:#334155;
      color:white;
    }

    button{
      cursor:pointer;
    }
  </style>
</head>

<body>

  <!-- AUTH SCREEN -->

  <main class="content" id="auth-screen" style="max-width:560px;margin:40px auto;">
    <section class="card">

      <div class="section-head">
        <h3 id="auth-title">Login</h3>
      </div>

      <form id="auth-form">

        <p id="auth-message" style="min-height:20px;color:#9ec5ff;margin-bottom:10px;"></p>

        <p style="margin-bottom:10px;">
          <input id="auth-name" placeholder="Full Name (only for signup)" />
        </p>

        <p style="margin-bottom:10px;">
          <input id="auth-email" type="email" placeholder="Email" required />
        </p>

        <p style="margin-bottom:10px;">
          <input id="auth-password" type="password" placeholder="Password" required />
        </p>

        <button class="cta" type="submit" id="auth-submit">
          Login
        </button>

        <button type="button" id="auth-switch" class="cta" style="margin-left:10px;background:#475569;">
          Need Signup?
        </button>

      </form>
    </section>
  </main>

  <!-- APP -->

  <div class="app-shell" id="app-shell" style="display:none;">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <h1>ProjectFlow</h1>

      <nav id="sidebar-nav">
        <a class="active" href="#" data-view="dashboard">Dashboard</a>
        <a href="#" data-view="projects">Projects</a>
        <a href="#" data-view="tasks">Tasks</a>
        <a href="#" data-view="team">Team</a>
      </nav>

      <button class="cta" id="new-project-btn">
        + New Project
      </button>

      <button class="cta" id="new-task-btn" style="margin-top:10px;">
        + New Task
      </button>

    </aside>

    <!-- MAIN -->

    <main class="content">

      <header class="topbar card">

        <div>
          <h2 id="view-title">Welcome back 👋</h2>
          <p id="view-subtitle">
            Track progress, assignments, and overdue work in one place.
          </p>
        </div>

        <div class="user-pill" id="user-pill">
          Guest
        </div>

      </header>

      <!-- STATS -->

      <section class="stats-grid">

        <article class="card stat">
          <h3>Total Tasks</h3>
          <p id="stat-total">0</p>
        </article>

        <article class="card stat">
          <h3>In Progress</h3>
          <p id="stat-progress">0</p>
        </article>

        <article class="card stat">
          <h3>Done</h3>
          <p id="stat-done">0</p>
        </article>

        <article class="card stat">
          <h3>Overdue</h3>
          <p id="stat-overdue">0</p>
        </article>

      </section>

      <!-- TABLE -->

      <section class="card">

        <div class="section-head">
          <h3 id="table-title">Recent Tasks</h3>

          <div>
            <button id="view-all-btn" class="cta">
              View All
            </button>

            <button id="logout-btn" class="cta" style="background:#dc2626;">
              Logout
            </button>
          </div>
        </div>

        <table>

          <thead>
            <tr>
              <th>Name</th>
              <th>Owner / Assignee</th>
              <th>Status</th>
              <th>Due</th>
            </tr>
          </thead>

          <tbody id="table-body"></tbody>

        </table>

      </section>

    </main>

  </div>

<script>

const USERS_KEY = "pf_users";
const SESSION_KEY = "pf_session";

let authMode = "login";
let currentUser = null;

const teamMembers = [
  "Rina",
  "Lee",
  "Maya",
  "Arun",
  "Nina"
];

const projects = [
  {
    id:1,
    name:"Website Revamp",
    owner:"Rina",
    status:"In Progress",
    due:"2026-05-22"
  },
  {
    id:2,
    name:"Mobile App",
    owner:"Lee",
    status:"To Do",
    due:"2026-06-03"
  }
];

const tasks = [
  {
    task:"Set up auth flow",
    projectId:1,
    assignee:"Rina",
    status:"To Do",
    due:"2026-05-08"
  },
  {
    task:"Project API endpoints",
    projectId:2,
    assignee:"Lee",
    status:"In Progress",
    due:"2026-05-06"
  },
  {
    task:"Dashboard charts",
    projectId:1,
    assignee:"Maya",
    status:"Done",
    due:"2026-05-04"
  }
];

const views = {

  dashboard:{
    title:"Welcome back 👋",
    subtitle:"Track progress in one place.",
    tableTitle:"Recent Tasks"
  },

  projects:{
    title:"Projects",
    subtitle:"Manage projects and admins.",
    tableTitle:"All Projects"
  },

  tasks:{
    title:"Tasks",
    subtitle:"Track assigned tasks.",
    tableTitle:"All Tasks"
  },

  team:{
    title:"Team",
    subtitle:"View contributors.",
    tableTitle:"Team Members"
  }

};

const nav = document.getElementById("sidebar-nav");
const tableBody = document.getElementById("table-body");

function users(){
  return JSON.parse(localStorage.getItem(USERS_KEY) || "[]");
}

function saveUsers(data){
  localStorage.setItem(USERS_KEY, JSON.stringify(data));
}

function syncUi(){

  const loggedIn = Boolean(currentUser);

  document.getElementById("auth-screen").style.display =
    loggedIn ? "none" : "block";

  document.getElementById("app-shell").style.display =
    loggedIn ? "grid" : "none";

  document.getElementById("user-pill").textContent =
    loggedIn ? currentUser.name : "Guest";
}

function setMessage(text,color="#9ec5ff"){

  const el = document.getElementById("auth-message");

  el.textContent = text;
  el.style.color = color;
}

function setAuthMode(mode){

  authMode = mode;

  document.getElementById("auth-title").textContent =
    mode === "login" ? "Login" : "Signup";

  document.getElementById("auth-submit").textContent =
    mode === "login" ? "Login" : "Create Account";

  document.getElementById("auth-switch").textContent =
    mode === "login"
      ? "Need Signup?"
      : "Back to Login";
}

function statusTag(status){

  return `
    <span class="tag ${
      status === "Done"
      ? "done"
      : status === "In Progress"
      ? "progress"
      : "todo"
    }">
      ${status}
    </span>
  `;
}

function updateStats(){

  const total = tasks.length;

  const progress =
    tasks.filter(t=>t.status==="In Progress").length;

  const done =
    tasks.filter(t=>t.status==="Done").length;

  const overdue =
    tasks.filter(t=>t.status!=="Done").length;

  document.getElementById("stat-total").textContent = total;
  document.getElementById("stat-progress").textContent = progress;
  document.getElementById("stat-done").textContent = done;
  document.getElementById("stat-overdue").textContent = overdue;
}

function renderTable(view){

  tableBody.innerHTML = "";

  if(view === "projects"){

    projects.forEach(project=>{

      const row = document.createElement("tr");

      row.innerHTML = `
        <td>${project.name}</td>
        <td>${project.owner}</td>
        <td>${statusTag(project.status)}</td>
        <td>${project.due}</td>
      `;

      tableBody.appendChild(row);

    });

    return;
  }

  if(view === "tasks" || view === "dashboard"){

    tasks.forEach(task=>{

      const project =
        projects.find(p=>p.id===task.projectId);

      const row = document.createElement("tr");

      row.innerHTML = `
        <td>
          ${task.task}
          <br>
          <small style="color:#94a3b8;">
            ${project ? project.name : ""}
          </small>
        </td>

        <td>${task.assignee}</td>

        <td>${statusTag(task.status)}</td>

        <td>${task.due}</td>
      `;

      tableBody.appendChild(row);

    });

    return;
  }

  if(view === "team"){

    teamMembers.forEach(member=>{

      const row = document.createElement("tr");

      row.innerHTML = `
        <td>${member}</td>
        <td>-</td>
        <td>${statusTag("Available")}</td>
        <td>-</td>
      `;

      tableBody.appendChild(row);

    });
  }
}

nav.addEventListener("click",(e)=>{

  const link = e.target.closest("a[data-view]");

  if(!link || !currentUser) return;

  e.preventDefault();

  nav.querySelectorAll("a")
    .forEach(a=>a.classList.remove("active"));

  link.classList.add("active");

  const viewKey = link.dataset.view;

  document.getElementById("view-title").textContent =
    views[viewKey].title;

  document.getElementById("view-subtitle").textContent =
    views[viewKey].subtitle;

  document.getElementById("table-title").textContent =
    views[viewKey].tableTitle;

  renderTable(viewKey);
});

document.getElementById("auth-switch")
.addEventListener("click",()=>{

  setAuthMode(
    authMode === "login"
      ? "signup"
      : "login"
  );
});

document.getElementById("auth-form")
.addEventListener("submit",(e)=>{

  e.preventDefault();

  const name =
    document.getElementById("auth-name")
    .value
    .trim();

  const email =
    document.getElementById("auth-email")
    .value
    .trim()
    .toLowerCase();

  const password =
    document.getElementById("auth-password")
    .value;

  const allUsers = users();

  // SIGNUP

  if(authMode === "signup"){

    if(!name){

      setMessage(
        "Name required",
        "#ffb4b4"
      );

      return;
    }

    const exists =
      allUsers.some(u=>u.email===email);

    if(exists){

      setMessage(
        "Email already exists",
        "#ffb4b4"
      );

      return;
    }

    allUsers.push({
      name,
      email,
      password
    });

    saveUsers(allUsers);

    setMessage(
      "Signup successful. Please login.",
      "#9ff0b4"
    );

    setAuthMode("login");

    return;
  }

  // LOGIN

  const user = allUsers.find(
    u =>
      u.email===email &&
      u.password===password
  );

  if(!user){

    setMessage(
      "Invalid email or password",
      "#ffb4b4"
    );

    return;
  }

  currentUser = {
    name:user.name,
    email:user.email
  };

  localStorage.setItem(
    SESSION_KEY,
    JSON.stringify(currentUser)
  );

  syncUi();

  renderTable("dashboard");

  updateStats();
});

document.getElementById("logout-btn")
.addEventListener("click",()=>{

  currentUser = null;

  localStorage.removeItem(SESSION_KEY);

  syncUi();
});

document.getElementById("new-project-btn")
.addEventListener("click",()=>{

  if(!currentUser) return;

  const name = prompt("Project Name");

  if(!name) return;

  projects.push({
    id:projects.length + 1,
    name,
    owner:currentUser.name,
    status:"To Do",
    due:"2026-05-30"
  });

  renderTable("projects");

  updateStats();
});

document.getElementById("new-task-btn")
.addEventListener("click",()=>{

  if(!currentUser) return;

  const taskName = prompt("Task Name");

  if(!taskName) return;

  tasks.push({
    task:taskName,
    projectId:1,
    assignee:currentUser.name,
    status:"To Do",
    due:"2026-05-15"
  });

  renderTable("tasks");

  updateStats();
});

currentUser =
  JSON.parse(
    localStorage.getItem(SESSION_KEY)
    || "null"
  );

setAuthMode("login");

syncUi();

if(currentUser){

  renderTable("dashboard");

  updateStats();
}

</script>

</body>
</html>
